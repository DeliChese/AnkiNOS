<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="reviewer-bottom.css"></head><body><center id="outer"><table id="innertable"><tbody><tr><td class="stat"><button title="Chỉnh sửa thẻ">Sửa</button></td><td id="middle" align="center"><table><tbody><tr><td><button id="ansbut" onclick="showPreviewAnswer()">Hiện đáp án<span class="stattxt">Space</span></button></td></tr></tbody></table></td><td class="stat" align="right"><button title="Tùy chọn">Thêm ⋯</button></td></tr></tbody></table></center><textarea id="nos-rating-keys" hidden>{"1":"1","2":"2","3":"3","4":"4"}</textarea><script src="reviewer-bottom.js"></script><script>
function showPreviewAnswer(){parent.postMessage({nosPreview:'answer'},'*');document.getElementById('middle').innerHTML='<center><table><tbody><tr>'+[[1,'Quên','&lt;1 phút'],[2,'Khó','6 phút'],[3,'Tốt','10 phút'],[4,'Dễ','4 ngày']].map(([ease,label,due])=>'<td><button data-ease="'+ease+'" onclick="gradePreview()">'+label+'<span class="nobold">'+due+'</span></button></td>').join('')+'</tr></tbody></table></center>';}
function gradePreview(){parent.postMessage({nosPreview:'grade'},'*');document.getElementById('middle').innerHTML='<table><tbody><tr><td><button id="ansbut" onclick="showPreviewAnswer()">Hiện đáp án<span class="stattxt">Space</span></button></td></tr></tbody></table>';}
window.addEventListener('message',event=>{if(event.source===parent && event.data?.nosPreview==='show-answer')showPreviewAnswer();});
</script></body></html>
