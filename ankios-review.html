<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnkiNOS — Xem trước phiên học</title><link rel="stylesheet" href="assets/reviewer.css"><style>
html,body{margin:0;height:100%;overflow:hidden}.card{background:#f8fafc;color:#25334b;font:23px/1.7 'Segoe UI',sans-serif}.preview-main{height:calc(100vh - 104px);overflow:auto}.preview-main #nos-review-stage{min-height:calc(100vh - 182px)}.preview-phonetic{font-size:17px;color:#7c8da6;margin-top:9px}.preview-hanzi{font-size:62px;line-height:1.5;letter-spacing:6px}.preview-prompt{font-size:14px;color:#8695ab;margin-top:18px}.preview-answer{font-size:24px;color:#3567a7}.preview-badge{position:absolute;top:95px;left:0;right:0;text-align:center;font:10px 'Segoe UI',sans-serif;color:#ebf1ffb5;pointer-events:none}iframe{display:block;position:fixed;left:0;bottom:0;width:100%;height:104px;border:0}@media(max-width:600px){iframe{height:112px}.preview-main{height:calc(100vh - 112px)}}
</style></head><body class="card"><div class="preview-main"><div id="nos-review-shell"><div class="nos-review-wallpaper" aria-hidden="true"></div><header id="nos-review-header"></header><main id="nos-review-stage"><section id="nos-review-card"><div id="qa" style="text-align:center"><div class="preview-hanzi">慢慢来</div><div class="preview-phonetic">màn màn lái</div><p class="preview-prompt">Cụm từ này có nghĩa là gì?</p></div></section></main><div class="preview-badge">Bản xem trước · Không ghi lịch sử ôn tập</div></div></div><textarea id="nos-review-bootstrap" hidden>{"deck":"Ngoại ngữ :: Tiếng Trung trong ngữ cảnh","theme":"dusk","answered":8}</textarea><iframe id="preview-ratings" src="assets/reviewer-controls-preview.html" title="Nút trả lời thẻ"></iframe><script src="assets/reviewer.js"></script><script>
window.NOSReviewPreview={answer(){document.getElementById('qa').innerHTML='<div class="preview-hanzi">慢慢来</div><div class="preview-phonetic">màn màn lái</div><hr id="answer"><div class="preview-answer">Cứ từ từ, không cần vội.</div><p class="preview-prompt">慢慢来，别着急。<br>Cứ từ từ, đừng sốt ruột.</p>';window.NOSReview.setState({side:'answer',answered:8});},grade(){document.getElementById('qa').innerHTML='<div class="preview-hanzi">继续加油</div><div class="preview-phonetic">jì xù jiā yóu</div><p class="preview-prompt">Cụm từ này có nghĩa là gì?</p>';window.NOSReview.setState({side:'question',answered:9});}};
window.addEventListener('message',event=>{if(event.source!==document.getElementById('preview-ratings').contentWindow)return;const action=event.data?.nosPreview;if(action==='answer'||action==='grade')window.NOSReviewPreview[action]();});
</script></body></html>
