name: AnkiNOS code and image library checks

on:
  push:
    branches:
      - feat/local-image-library-wallpapers-avatar
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax
        run: python -m compileall -q integration.py reviewer_ui.py media_store.py data.py
      - name: Local image library tests
        run: python -m unittest discover -s tests -p 'test_media.py'
      - name: JavaScript syntax
        run: |
          node --check assets/dashboard.js
          node --check assets/overview.js
          node --check assets/reviewer.js
      - name: Dashboard preview browser smoke test
        env:
          NOS_CHROME: /usr/bin/google-chrome
        run: node tests/ui-check.mjs
